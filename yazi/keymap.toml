[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on   = "?"
run  = "help"
desc = "Open help menu"

[[mgr.prepend_keymap]]
on   = "d"
run  = "remove"
desc = "Trash selected files (with confirm)"

[[mgr.prepend_keymap]]
on   = "D"
run  = "remove --permanently --force"
desc = "Permanently delete selected files (no confirm)"

[[mgr.prepend_keymap]]
on   = "H"
run  = "plugin duckdb -1"
desc = "Scroll one column to the left"

[[mgr.prepend_keymap]]
on   = "L"
run  = "plugin duckdb +1"
desc = "Scroll one column to the right"

[[mgr.prepend_keymap]]
on   = ["g", "o"]
run  = "plugin duckdb -open"
desc = "Open with duckdb"

[[mgr.prepend_keymap]]
on   = ["g", "u"]
run  = "plugin duckdb -ui"
desc = "Open with duckdb UI"

[[mgr.prepend_keymap]]
on   = "e"
run  = "shell 'nvim %s' --block"
desc = "Edit with Neovim"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "lua 'local h = cx.active.current.hovered; if h and h:is_dir() then ya.emit(\"cd\", { h.url }); ya.emit(\"quit\") else ya.emit(\"open\") end'"
desc = "CD into dir & quit, or open file"

[[mgr.prepend_keymap]]
on   = "o"
run  = "open --interactive"
desc = "Open with an opener (interactive)"
