[mgr]
ratio = [1, 2, 5]

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- leaf --inline=ansi --width=$w "$1"'

[[plugin.prepend_previewers]]
url = "*.csv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.tsv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.json"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.parquet"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.xlsx"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.db"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.duckdb"
run = "duckdb"

[[plugin.prepend_preloaders]]
url = "*.csv"
run = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url = "*.tsv"
run = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url = "*.json"
run = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url = "*.parquet"
run = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url = "*.xlsx"
run = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url = "*.db"
run = "duckdb"
multi = false

[[plugin.prepend_preloaders]]
url = "*.duckdb"
run = "duckdb"
multi = false

[opener]
nvim = [
	{ run = "nvim %s", desc = "Edit with Neovim", block = true },
]
brave = [
	{ run = 'open -a "Brave Browser" %s', desc = "Open with Brave", block = false },
]
leaf = [
	{ run = "leaf %s1", desc = "Open with Leaf", block = true },
]
reveal = [
	{ run = "open -R %s1", desc = "Reveal", for = "macos" },
]

[open]
prepend_rules = [
	{ url = "*.html", use = "brave" },
	{ url = "*.htm",  use = "brave" },
	{ url = "*.md",   use = "leaf" },
]
