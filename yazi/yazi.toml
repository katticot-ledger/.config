[mgr]
ratio = [1, 2, 5]

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- leaf --inline=ansi --width=$w "$1"'

[[plugin.prepend_previewers]]
url = "*.csv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.tsv"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.json"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.parquet"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.txt"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.xlsx"
run = "duckdb"

[[plugin.prepend_previewers]]
url = "*.db"
run = "duckdb"

[[plugin.prepend_previewers]]
