name = "GMail — unread"
description = "Show last 5 unread emails"
command = '''cat > /tmp/herdr-gmail.sh << 'EOF'
#!/bin/bash
printf '\033[1;36m═══ GMail — unread ═══\033[0m\n'
gmcli keita@powerhive.com search "in:inbox is:unread" --max 5
STATUS=$?
if [ $STATUS -eq 0 ]; then
  printf '\n\033[1;32m✓ Done\033[0m\n'
else
  printf '\n\033[1;31m✗ Failed (exit %d)\033[0m\n' $STATUS
fi
EOF
PID=$(herdr pane split --direction right --no-focus 2>&1 | jq -r .result.pane.pane_id)
sleep 1
herdr pane send-text "$PID" "bash /tmp/herdr-gmail.sh; rm -f /tmp/herdr-gmail.sh"
herdr pane send-keys "$PID" "enter"'''
