name = "Todoist today"
description = "Show today's tasks"
command = '''cat > /tmp/herdr-todo.sh << 'EOF'
#!/bin/bash
printf '\033[1;36m═══ Todoist — today ═══\033[0m\n'
td today
STATUS=$?
if [ $STATUS -eq 0 ]; then
  printf '\n\033[1;32m✓ Done\033[0m\n'
else
  printf '\n\033[1;31m✗ Failed (exit %d)\033[0m\n' $STATUS
fi
EOF
PID=$(herdr pane split --direction right --no-focus 2>&1 | jq -r .result.pane.pane_id)
sleep 1
herdr pane send-text "$PID" "bash /tmp/herdr-todo.sh; rm -f /tmp/herdr-todo.sh"
herdr pane send-keys "$PID" "enter"'''
